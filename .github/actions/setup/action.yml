name: Setup pnpm and Node
description: >-
    Installs pnpm (version from the root package.json `packageManager` field),
    Node.js (version from mise.toml so CI and the Docker images stay on the
    same runtime), and installs dependencies.

# Do not cache .turbo across runs. pnpm injects workspace packages
# (injectWorkspacePackages), and a Turbo cache hit skips the build script,
# so pnpm never syncs the restored dist/ into the injected copy and
# dependents fail with TS2307 (see docs/ci-cd.md).

runs:
    using: composite
    steps:
        - name: Read Node version from mise.toml
          id: versions
          shell: bash
          run: |
              node_version="$(./.github/scripts/node-version.sh)"
              echo "node=$node_version" >> "$GITHUB_OUTPUT"

        - name: Setup pnpm
          uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

        - name: Setup Node.js
          uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
          with:
              node-version: ${{ steps.versions.outputs.node }}
              cache: pnpm
              cache-dependency-path: pnpm-lock.yaml

        - name: Install dependencies
          shell: bash
          run: pnpm install --frozen-lockfile
