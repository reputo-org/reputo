name: Pull Request

on:
    pull_request:
        branches: [main]

concurrency:
    group: pr-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    quality-gate:
        uses: ./.github/workflows/_quality-gate.yml
        secrets:
            CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

    # Diff-based: fails only when this PR introduces a dependency with a
    # known high or critical vulnerability. Needs the dependency graph,
    # which GitHub enables by default on public repositories.
    dependency-review:
        name: Dependency review
        runs-on: ubuntu-24.04
        timeout-minutes: 10
        permissions:
            contents: read
        steps:
            - name: Checkout code
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

            - name: Dependency review
              uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
              with:
                  fail-on-severity: high

    build:
        needs: quality-gate
        permissions:
            contents: read
            packages: write
        uses: ./.github/workflows/_build-and-push.yml
        with:
            ref: ${{ github.sha }}
            push: false
            affected: true

    pull-request-gate:
        name: Pull request gate
        needs:
            - quality-gate
            - dependency-review
            - build
        if: ${{ always() }}
        runs-on: ubuntu-24.04
        timeout-minutes: 5
        steps:
            - name: Verify required jobs
              env:
                  QUALITY_GATE_RESULT: ${{ needs.quality-gate.result }}
                  DEPENDENCY_REVIEW_RESULT: ${{ needs.dependency-review.result }}
                  BUILD_RESULT: ${{ needs.build.result }}
              run: |
                  printf 'quality-gate=%s\ndependency-review=%s\nbuild=%s\n' \
                    "$QUALITY_GATE_RESULT" \
                    "$DEPENDENCY_REVIEW_RESULT" \
                    "$BUILD_RESULT"

                  if [ "$QUALITY_GATE_RESULT" != 'success' ] || \
                     [ "$DEPENDENCY_REVIEW_RESULT" != 'success' ] || \
                     [ "$BUILD_RESULT" != 'success' ]; then
                      exit 1
                  fi
